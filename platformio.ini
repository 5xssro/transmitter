; PlatformIO — rovnaký sketch ako v Arduino IDE (root transmitter.ino + *.h / font *.c).
; Výber prostredia: Default = LOLIN S3 Pro (ako arduino-cli board).

[platformio]
default_envs = lolin_s3_pro
src_dir = .

[env]
framework = arduino
monitor_speed = 115200

; Neprekladať tools, build artefakty, assety na karte.
build_src_filter =
  +<*>
  -<tools/>
  -<build/>
  -<.pio/>
  -<_deps/>
  -<sd_assets/>
  -<include/>

[env:lolin_s3_pro]
platform = espressif32
board = lolin_s3_pro
board_build.flash_mode = qio
board_build.psram_type = opi

build_flags =
  -I${PROJECT_DIR}
  -I${PROJECT_DIR}/include
  -DLV_CONF_INCLUDE_SIMPLE
  ; SPI SD na S3 Pro: tft_sd.h — SD_SPI_CS_PIN 46
  ; SimpleFTPServer: obe makrá, inak ostane STORAGE_FFAT (FtpServerKey.h)
  -DDEFAULT_FTP_SERVER_NETWORK_TYPE_ESP32=6
  -DDEFAULT_STORAGE_TYPE_ESP32=5

lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  lvgl/lvgl@~8.3.11
  me-no-dev/ESPAsyncWebServer@^3.1.0
  xreef/SimpleFTPServer@^2.1.7

[env:lolin_s3_mini]
; Voliteľná alternatíva — po importe over TFT + CS SD v tft_sd.h.
platform = espressif32
board = lolin_s3_mini
build_flags =
  -I${PROJECT_DIR}
  -I${PROJECT_DIR}/include
  -DLV_CONF_INCLUDE_SIMPLE
  -DDEFAULT_FTP_SERVER_NETWORK_TYPE_ESP32=6
  -DDEFAULT_STORAGE_TYPE_ESP32=5
lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  lvgl/lvgl@~8.3.11
  me-no-dev/ESPAsyncWebServer@^3.1.0
  xreef/SimpleFTPServer@^2.1.7
